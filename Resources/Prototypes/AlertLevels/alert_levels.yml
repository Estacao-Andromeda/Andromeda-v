- type: alertLevels
  id: stationAlerts
  defaultLevel: green
  levels:
    green:
      announcement: alert-level-green-announcement
      color: Green
      sound: /Audio/_andromeda/Announcements/alert-level-green-announcement.ogg
      emergencyLightColor: LawnGreen
      shuttleTime: 600
    blue:
      announcement: alert-level-blue-announcement
      sound: /Audio/_andromeda/Announcements/alert-level-blue-announcement.ogg
      color: DodgerBlue
      forceEnableEmergencyLights: true
      emergencyLightColor: DodgerBlue
      shuttleTime: 600
    violet:
      announcement: alert-level-violet-announcement
      sound: /Audio/_andromeda/Announcements/alert-level-violet-announcement.ogg
      color: Violet
      emergencyLightColor: Violet
      forceEnableEmergencyLights: true
      shuttleTime: 600
    white:
      announcement: alert-level-white-announcement
      sound: /Audio/_andromeda/Announcements/alert-level-white-announcement.ogg
      emergencyLightColor: "#F6CCF6"
      color: White
      forceEnableEmergencyLights: true
      shuttleTime: 600
    yellow:
      announcement: alert-level-yellow-announcement
      sound: /Audio/_andromeda/Announcements/alert-level-yellow-announcement.ogg
      color: Yellow
      emergencyLightColor: Goldenrod
      forceEnableEmergencyLights: true
      shuttleTime: 600
    red:
      announcement: alert-level-red-announcement
      sound: /Audio/_andromeda/Announcements/alert-level-red-announcement.ogg
      color: Red
      emergencyLightColor: Red
      forceEnableEmergencyLights: true
      shuttleTime: 600 #No reduction in time as we don't have swiping for red alert like in /tg/. Shuttle times are intended to create friction, so having a way to brainlessly bypass that would be dumb.
  # Begin Starlight Additions
    orange:
      announcement: alert-level-orange-announcement
      selectable: true
      sound:
        path: /Audio/_Starlight/misc/orange.ogg
      color: "#ff8119"
      emergencyLightColor: "#ff8119"
      forceEnableEmergencyLights: true
      shuttleTime: 480
  # End Starlight Additions
    gamma:
      announcement: alert-level-gamma-announcement
      selectable: false
      sound: /Audio/_andromeda/Announcements/alert-level-gamma-announcement.ogg
      disableSelection: true
      color: PaleVioletRed
      emergencyLightColor: PaleVioletRed
      forceEnableEmergencyLights: true
      shuttleTime: 600
    delta:
      announcement: alert-level-delta-announcement
      selectable: false
      sound: /Audio/_andromeda/Announcements/alert-level-delta-announcement.ogg
      disableSelection: true
      color: DarkRed
      emergencyLightColor: Orange
      forceEnableEmergencyLights: true
      shuttleTime: 600 # DeltaV - let people leave
    epsilon:
      announcement: alert-level-epsilon-announcement
      selectable: false
      sound: /Audio/_andromeda/Announcements/alert-level-epsilon-announcement.ogg
      disableSelection: true
      color: DarkViolet
      emergencyLightColor: DarkViolet
      forceEnableEmergencyLights: true
      shuttleTime: 1200
    octarine: # DeltaV - Cosmic Cult
      announcement: alert-level-octarine-announcement
      selectable: false
      sound: /Audio/_andromeda/Announcements/alert-level-octarine-announcement.ogg
      disableSelection: true
      color: CadetBlue
      emergencyLightColor: CadetBlue
      forceEnableEmergencyLights: true
      shuttleTime: 600
